description: >-
  Carvel publishes no plans and no pricing, and that is the correct finding rather than a gap.
  Every tool is Apache-2.0 licensed, distributed as a signed binary or Go module, and run on
  hardware the user already owns. There is no account, no metering and nothing to bill, so
  plan_count is 0. This file replaces a 2026-05-04 bulk-sweep scaffold that had invented a "Free"
  and a "Professional" tier with request quotas for an API that does not exist.
plan_count: 0
plans: []
pricing_url: null
free_tier: true
free_tier_note: >-
  Everything is free in the open-source sense — Apache-2.0, no registration, no rate card. Costs
  land on the operator's own cluster, registry and CI, none of which Carvel bills for.
commercial_offering: null
commercial_note: >-
  No paid edition, no hosted edition, no support contract sold by the project. Carvel is a CNCF
  Sandbox project; commercial support historically came from VMware Tanzu distributions, which is
  a downstream vendor relationship and not a Carvel plan.
