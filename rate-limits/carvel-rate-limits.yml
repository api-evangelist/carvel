specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Carvel
providerId: carvel
created: '2026-05-04'
modified: '2026-09-05'
generated: '2026-09-05'
method: searched
source: https://carvel.dev/
description: >-
  Carvel operates no endpoint, so it imposes no rate limit and returns no rate-limit header —
  limit_count is 0 because there is nothing to limit, not because limits are undocumented. This
  file replaces a 2026-05-04 bulk-sweep scaffold that had invented per-key quotas and
  X-RateLimit-* headers for an API that does not exist. The throttling a Carvel user actually
  meets belongs to third parties, and is recorded below as such.
limit_count: 0
limits: []
headers: {}
responseCodes: {}
third_party_limits:
  - source: OCI registry
    applies_to: [imgpkg, kbld, vendir, kapp-controller]
    note: >-
      Docker Hub, GHCR, ECR and Harbor each enforce their own pull/push limits. imgpkg copy of a
      large bundle is the operation most likely to hit them; the docs cover proxy configuration
      and resumable tar copies, not rate limits.
    owner: third-party
  - source: Kubernetes API server
    applies_to: [kapp, kctrl, kapp-controller, secretgen-controller]
    note: >-
      Client-side QPS/burst and server-side API Priority and Fairness are the cluster's settings.
      kapp exposes --apply-concurrency (default 5) and --apply-check-interval (default 1s), which
      shape how hard it drives the apiserver.
    owner: third-party
  - source: GitHub API
    applies_to: [vendir]
    note: githubRelease sources are subject to GitHub's unauthenticated rate limits unless a token is supplied.
    owner: third-party
evidence:
  - {url: 'https://carvel.dev/', http_status: 200, note: No API, no published limits, no rate-limit headers to observe.}
  - {url: 'https://carvel.dev/kapp/docs/v0.64.x/command-reference/', http_status: 200, note: Source of the --apply-concurrency and --apply-check-interval defaults.}
tags: [CLI, Kubernetes, Open Source, Rate Limiting]
